<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" fill="none" aria-hidden="true">
  <title>Diagram: laminar headboard breathing zone versus mixed room air</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f7fb"/>
      <stop offset="100%" stop-color="#e8eef6"/>
    </linearGradient>
    <linearGradient id="clean" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0a1628" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="room" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="960" rx="24" fill="url(#bg)"/>
  <!-- Room volume -->
  <rect x="80" y="120" width="1440" height="720" rx="16" fill="white" stroke="#0a1628" stroke-opacity="0.08" stroke-width="2"/>
  <text x="120" y="180" fill="#0a1628" font-family="system-ui, Segoe UI, sans-serif" font-size="34" font-weight="700">Headboard breathing zone (concept)</text>
  <text x="120" y="225" fill="#394a60" font-family="system-ui, Segoe UI, sans-serif" font-size="22">Laminar delivery keeps filtered air cohesive toward the sleeper—not only diluting pollutants room-wide.</text>
  <!-- Headboard -->
  <rect x="980" y="320" width="180" height="420" rx="12" fill="#0a1628"/>
  <rect x="988" y="332" width="164" height="396" rx="8" fill="#122a42"/>
  <!-- bed -->
  <rect x="360" y="560" width="640" height="180" rx="16" fill="#f8fafc" stroke="#0a1628" stroke-opacity="0.15" stroke-width="2"/>
  <rect x="400" y="520" width="320" height="80" rx="12" fill="#e2e8f0"/>
  <!-- Sleeper abstract -->
  <ellipse cx="520" cy="580" rx="70" ry="36" fill="#cbd5e1" opacity="0.9"/>
  <rect x="460" y="560" width="120" height="44" rx="22" fill="#94a3b8" opacity="0.35"/>
  <!-- Clean zone funnel -->
  <path d="M1040 360 L780 620 L740 590 L980 348 Z" fill="url(#clean)" filter="url(#soft)" opacity="0.95"/>
  <!-- Laminar arrows -->
  <g stroke="#0f766e" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <path d="M1010 420 L860 520"/>
    <path d="M1010 480 L820 540"/>
    <path d="M1010 540 L800 580"/>
    <path d="M1010 600 L820 620"/>
  </g>
  <g fill="#0f766e">
    <polygon points="850,515 860,520 855,530"/>
    <polygon points="810,535 820,540 812,548"/>
    <polygon points="790,575 800,580 792,590"/>
    <polygon points="810,615 820,620 812,628"/>
  </g>
  <!-- Mixed room swirls -->
  <g fill="url(#room)" opacity="0.7">
    <circle cx="320" cy="380" r="38"/>
    <circle cx="240" cy="520" r="26"/>
    <circle cx="400" cy="460" r="22"/>
    <circle cx="300" cy="620" r="30"/>
  </g>
  <text x="220" y="360" fill="#64748b" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-style="italic">Room air (mixed)</text>
  <!-- Simple comparative bars -->
  <g transform="translate(120 700)">
    <text x="0" y="0" fill="#0a1628" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="600">Relative particle load (qualitative)</text>
    <rect x="0" y="20" width="420" height="36" rx="8" fill="#e2e8f0"/>
    <rect x="0" y="20" width="92" height="36" rx="8" fill="#2dd4bf"/>
    <text x="8" y="46" fill="#0a1628" font-family="system-ui,Segoe UI,sans-serif" font-size="16">Near headboard zone</text>
    <rect x="0" y="80" width="420" height="36" rx="8" fill="#e2e8f0"/>
    <rect x="0" y="80" width="290" height="36" rx="8" fill="#94a3b8"/>
    <text x="8" y="106" fill="#0a1628" font-family="system-ui,Segoe UI,sans-serif" font-size="16">Typical room-average exposure</text>
  </g>
  <text x="1200" y="870" fill="#64748b" font-family="system-ui,Segoe UI,sans-serif" font-size="16">Illustrative only — match quantitative claims to your approved PDP/legal copy.</text>
</svg>
